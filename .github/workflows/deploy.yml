name: Build and deploy Legatech

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress_content_changed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legatech-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORDPRESS_API_URL: https://staging2.legatech.hr/?rest_route=/wp/v2
      WORDPRESS_SNAPSHOT_URL: https://staging2.legatech.hr/wp-content/uploads/legatech-blog/feed.json
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Restore last valid WordPress snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            src/generated/blog-posts.json
            public/blog-media
          key: wordpress-blog-${{ github.run_id }}
          restore-keys: |
            wordpress-blog-

      - name: Install PHP mail dependencies
        run: |
          composer install --working-dir=server/contact --no-dev --no-interaction --prefer-dist --optimize-autoloader
          mkdir -p public/api/vendor
          cp -R server/contact/vendor/. public/api/vendor/

      - name: Verify source
        run: npm run lint

      - name: Synchronize WordPress blog
        id: wordpress_sync
        continue-on-error: true
        run: npm run sync:blog

      - name: Save valid WordPress snapshot
        if: steps.wordpress_sync.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            src/generated/blog-posts.json
            public/blog-media
          key: wordpress-blog-${{ github.run_id }}

      - name: Require fresh content for WordPress publishing
        if: steps.wordpress_sync.outcome != 'success' && github.event_name == 'repository_dispatch'
        run: |
          echo "WordPress content changed, but a fresh snapshot could not be downloaded. Keeping the current site online." >&2
          exit 1

      - name: Use last valid snapshot for code deployment
        if: steps.wordpress_sync.outcome != 'success' && github.event_name != 'repository_dispatch'
        run: echo "::warning::WordPress REST is temporarily unavailable. Building with the last valid blog snapshot."

      - name: Build static website
        run: npm run build:offline

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SITEGROUND_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N '' -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install private contact configuration
        env:
          CONTACT_RATE_LIMIT_SALT: ${{ secrets.CONTACT_RATE_LIMIT_SALT }}
          DEPLOY_PATH: ${{ secrets.SITEGROUND_DEPLOY_PATH }}
          SMTP_PASSWORD: ${{ secrets.SITEGROUND_SMTP_PASSWORD }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
        run: |
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != "/" ]]
          config_file="$RUNNER_TEMP/legatech-contact.php"
          umask 077
          SMTP_PASSWORD="$SMTP_PASSWORD" CONTACT_RATE_LIMIT_SALT="$CONTACT_RATE_LIMIT_SALT" php -r '
            $config = [
              "smtp_host" => "mail.legatech.hr",
              "smtp_port" => 465,
              "smtp_encryption" => "ssl",
              "smtp_username" => "info@legatech.hr",
              "smtp_password" => getenv("SMTP_PASSWORD"),
              "from_email" => "info@legatech.hr",
              "from_name" => "Legatech web",
              "recipient_email" => "info@legatech.hr",
              "allowed_origins" => ["https://legatech.hr", "https://www.legatech.hr"],
              "rate_limit_salt" => getenv("CONTACT_RATE_LIMIT_SALT"),
            ];
            echo "<?php\n\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n";
          ' > "$config_file"
          private_dir="$(dirname "$DEPLOY_PATH")/private"
          printf -v quoted_private_dir '%q' "$private_dir"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p $quoted_private_dir; chmod 700 $quoted_private_dir"
          scp -P "$SSH_PORT" "$config_file" "$SSH_USER@$SSH_HOST:$private_dir/legatech-contact.php"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod 600 $quoted_private_dir/legatech-contact.php"
          rm -f "$config_file"

      - name: Package and upload release
        env:
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
        run: |
          tar -czf legatech-site.tar.gz -C out .
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p ~/legatech-deploy/incoming'
          scp -P "$SSH_PORT" legatech-site.tar.gz scripts/deploy-siteground.sh "$SSH_USER@$SSH_HOST:~/legatech-deploy/incoming/"

      - name: Activate release
        env:
          DEPLOY_PATH: ${{ secrets.SITEGROUND_DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
        run: |
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != "/" ]]
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash ~/legatech-deploy/incoming/deploy-siteground.sh ~/legatech-deploy/incoming/legatech-site.tar.gz $quoted_path $GITHUB_SHA"
