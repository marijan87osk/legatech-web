name: Build and deploy Legatech

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress_content_changed]
  workflow_dispatch:
    inputs:
      bootstrap_production_marker:
        description: Confirm the live document root and create its one-time production marker
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: legatech-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.release_id.outputs.release_id }}
    env:
      WORDPRESS_API_URL: https://staging2.legatech.hr/?rest_route=/wp/v2
      WORDPRESS_SNAPSHOT_FILE: wordpress-content/blog-snapshot.json
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Restore last valid WordPress snapshot
        uses: actions/cache/restore@v4
        with:
          path: |
            src/generated/blog-posts.json
            public/blog-media
          key: wordpress-blog-${{ github.run_id }}
          restore-keys: |
            wordpress-blog-

      - name: Install PHP mail dependencies
        run: |
          composer install --working-dir=server/contact --no-dev --no-interaction --prefer-dist --optimize-autoloader
          mkdir -p public/api/vendor
          cp -R server/contact/vendor/. public/api/vendor/

      - name: Verify contact endpoint
        run: |
          php -l public/api/contact.php
          test -f public/api/vendor/autoload.php

      - name: Verify source
        run: |
          npm run lint
          bash -n scripts/deploy-siteground.sh
          bash -n scripts/test-deploy-siteground.sh

      - name: Test deployment and rollback
        run: bash scripts/test-deploy-siteground.sh

      - name: Synchronize WordPress blog
        id: wordpress_sync
        continue-on-error: true
        run: npm run sync:blog

      - name: Save valid WordPress snapshot
        if: steps.wordpress_sync.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            src/generated/blog-posts.json
            public/blog-media
          key: wordpress-blog-${{ github.run_id }}

      - name: Require fresh content for WordPress publishing
        if: ${{ steps.wordpress_sync.outcome != 'success' && (github.event_name == 'repository_dispatch' || startsWith(github.event.head_commit.message, 'content sync WordPress blog')) }}
        run: |
          echo "WordPress content changed, but a fresh snapshot could not be downloaded. Keeping the current site online." >&2
          exit 1

      - name: Use last valid snapshot for code deployment
        if: ${{ steps.wordpress_sync.outcome != 'success' && github.event_name != 'repository_dispatch' && !startsWith(github.event.head_commit.message, 'content sync WordPress blog') }}
        run: echo "::warning::WordPress REST is temporarily unavailable. Building with the last valid blog snapshot."

      - name: Build static website
        run: npm run build:offline

      - name: Verify exported contact endpoint
        run: |
          test -f out/api/contact.php
          test -f out/api/vendor/autoload.php

      - name: Verify SEO export
        run: npm run check:seo

      - name: Identify this release
        id: release_id
        run: |
          release_id=$(printf '%s:%s:%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-40)
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$release_id" > "out/legatech-release-$release_id.txt"

      - name: Package verified release
        run: |
          mkdir -p release
          tar -czf release/legatech-site.tar.gz -C out .
          cp scripts/deploy-siteground.sh release/deploy-siteground.sh
          node scripts/create-deploy-release.mjs

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: legatech-production-${{ github.sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy:
    name: Deploy production
    needs: build-and-deploy
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && vars.LEGATECH_AUTO_PUBLISH == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    env:
      DEPLOY_TARGET: production
      RELEASE_ID: ${{ needs.build-and-deploy.outputs.release_id }}
      SITEGROUND_SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
      SITEGROUND_SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
      SITEGROUND_SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
      SITEGROUND_SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
      SITEGROUND_SSH_KEY_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_KEY_PASSPHRASE }}
      SITEGROUND_KNOWN_HOSTS: ${{ secrets.SITEGROUND_KNOWN_HOSTS }}
      SITEGROUND_DEPLOY_PATH: ${{ secrets.SITEGROUND_DEPLOY_PATH }}
      SITEGROUND_SITE_URL: ${{ vars.SITEGROUND_SITE_URL }}
    steps:
      - name: Download verified release
        uses: actions/download-artifact@v4
        with:
          name: legatech-production-${{ github.sha }}
          path: release

      - name: Verify release and deployment settings
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c legatech-site.tar.gz.sha256 deploy-siteground.sh.sha256
          jq -e --arg sha "$GITHUB_SHA" '.sha == $sha' release.json >/dev/null
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}$ ]]
          test "$(tar -xOzf legatech-site.tar.gz "./legatech-release-$RELEASE_ID.txt")" = "$RELEASE_ID"
          [[ "$DEPLOY_TARGET" == production ]]
          test -n "$SITEGROUND_SSH_PRIVATE_KEY"
          test -n "$SITEGROUND_KNOWN_HOSTS"
          [[ "$SITEGROUND_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SITEGROUND_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$SITEGROUND_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$SITEGROUND_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+/public_html$ ]]
          [[ "$SITEGROUND_DEPLOY_PATH" != *'/../'* && "$SITEGROUND_DEPLOY_PATH" != *'/./'* ]]
          [[ "$SITEGROUND_SITE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]

      - name: Configure verified SSH connection
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/legatech-ssh"
          printf '%s\n' "$SITEGROUND_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/legatech-ssh/key"
          printf '%s\n' "$SITEGROUND_KNOWN_HOSTS" > "$RUNNER_TEMP/legatech-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/legatech-ssh/key" "$RUNNER_TEMP/legatech-ssh/known_hosts"
          if [[ -n "$SITEGROUND_SSH_KEY_PASSPHRASE" ]]; then
            cat > "$RUNNER_TEMP/legatech-ssh/askpass" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$SITEGROUND_SSH_KEY_PASSPHRASE"
          EOF
            chmod 700 "$RUNNER_TEMP/legatech-ssh/askpass"
            eval "$(ssh-agent -s -a "$RUNNER_TEMP/legatech-ssh/agent.sock")" >/dev/null
            SSH_ASKPASS="$RUNNER_TEMP/legatech-ssh/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0 ssh-add "$RUNNER_TEMP/legatech-ssh/key" >/dev/null
            printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi
          {
            printf 'Host legatech-target\n'
            printf '  HostName %s\n' "$SITEGROUND_SSH_HOST"
            printf '  Port %s\n' "$SITEGROUND_SSH_PORT"
            printf '  User %s\n' "$SITEGROUND_SSH_USER"
            printf '  IdentityFile %s\n' "$RUNNER_TEMP/legatech-ssh/key"
            printf '  UserKnownHostsFile %s\n' "$RUNNER_TEMP/legatech-ssh/known_hosts"
            printf '  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n  BatchMode yes\n'
            printf '  ConnectTimeout 15\n  ServerAliveInterval 30\n  ServerAliveCountMax 3\n'
          } > "$RUNNER_TEMP/legatech-ssh/config"
          chmod 600 "$RUNNER_TEMP/legatech-ssh/config"

      - name: Confirm live document root and create production marker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_production_marker }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TARGET" == production ]]
          [[ "$SITEGROUND_SITE_URL" == https://legatech.hr ]]
          [[ "$SITEGROUND_DEPLOY_PATH" == */www/legatech.hr/public_html ]]
          site_root="${SITEGROUND_DEPLOY_PATH%/public_html}"
          marker="$site_root/.legatech-environment"
          challenge="$SITEGROUND_DEPLOY_PATH/legatech-target-$RELEASE_ID.txt"
          remote="legatech-target"
          ssh_config="$RUNNER_TEMP/legatech-ssh/config"
          ssh -F "$ssh_config" "$remote" "set -e; test -d '$SITEGROUND_DEPLOY_PATH'; test ! -L '$SITEGROUND_DEPLOY_PATH'; test \"\$(realpath -e -- '$SITEGROUND_DEPLOY_PATH')\" = '$SITEGROUND_DEPLOY_PATH'; test -f '$site_root/private/legatech-contact.php'; test ! -e '$challenge'; test ! -L '$challenge'; (set -C; printf '%s\n' '$RELEASE_ID' > '$challenge')"
          cleanup_challenge() {
            ssh -F "$ssh_config" "$remote" "rm -f -- '$challenge'" || true
          }
          trap cleanup_challenge EXIT
          served=$(curl --silent --show-error --fail --location --max-time 30 --header 'Cache-Control: no-cache' "$SITEGROUND_SITE_URL/legatech-target-$RELEASE_ID.txt?probe=$GITHUB_RUN_ID")
          [[ "$served" == "$RELEASE_ID" ]]
          ssh -F "$ssh_config" "$remote" "set -e; test \"\$(cat '$challenge')\" = '$RELEASE_ID'; rm -- '$challenge'; test ! -L '$marker'; if test -e '$marker'; then grep -Fxq production '$marker'; else (set -C; umask 077; printf 'production\n' > '$marker'); fi; grep -Fxq production '$marker'"
          trap - EXIT

      - name: Deploy with server-side backup
        id: site_deploy
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="legatech-deploy/incoming/$RELEASE_ID"
          site_root="${SITEGROUND_DEPLOY_PATH%/public_html}"
          ssh -F "$RUNNER_TEMP/legatech-ssh/config" legatech-target "cd \"\$HOME\" && test -d '$SITEGROUND_DEPLOY_PATH' && test -f '$site_root/private/legatech-contact.php' && grep -Fxq '$DEPLOY_TARGET' '$site_root/.legatech-environment' && command -v rsync >/dev/null && command -v realpath >/dev/null && command -v tar >/dev/null && mkdir -p '$remote_dir'"
          scp -F "$RUNNER_TEMP/legatech-ssh/config" release/legatech-site.tar.gz release/deploy-siteground.sh "legatech-target:$remote_dir/"
          ssh -F "$RUNNER_TEMP/legatech-ssh/config" legatech-target "cd \"\$HOME\" && bash '$remote_dir/deploy-siteground.sh' '$remote_dir/legatech-site.tar.gz' '$SITEGROUND_DEPLOY_PATH' '$RELEASE_ID' '$DEPLOY_TARGET'"

      - name: Smoke-test deployed PHP endpoint
        shell: bash
        run: |
          set -euo pipefail
          released=false
          for attempt in $(seq 1 18); do
            marker=$(curl --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' "$SITEGROUND_SITE_URL/legatech-release-$RELEASE_ID.txt?probe=$attempt" || true)
            if [[ "$marker" == "$RELEASE_ID" ]]; then
              released=true
              break
            fi
            sleep 10
          done
          test "$released" = true
          homepage_status=000
          for attempt in $(seq 1 8); do
            homepage_status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$SITEGROUND_SITE_URL/?probe=$attempt" || true)
            if [[ "$homepage_status" == 200 ]]; then
              break
            fi
            sleep 5
          done
          test "$homepage_status" = 200
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          contact_verified=false
          for attempt in $(seq 1 8); do
            status=$(curl --silent --show-error --location --max-time 30 --output "$response_file" --write-out '%{http_code}' "$SITEGROUND_SITE_URL/api/contact.php?probe=$attempt" || true)
            if [[ "$status" == 405 ]] && jq -e '.ok == false' "$response_file" >/dev/null 2>&1; then
              contact_verified=true
              break
            fi
            sleep 5
          done
          test "$contact_verified" = true

      - name: Restore previous site if smoke test fails
        if: ${{ failure() && steps.site_deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="legatech-deploy/incoming/$RELEASE_ID"
          ssh -F "$RUNNER_TEMP/legatech-ssh/config" legatech-target "cd \"\$HOME\" && bash '$remote_dir/deploy-siteground.sh' --rollback '$SITEGROUND_DEPLOY_PATH' '$RELEASE_ID' '$DEPLOY_TARGET'"

      - name: Stop ephemeral SSH agent
        if: always()
        shell: bash
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null
          fi
